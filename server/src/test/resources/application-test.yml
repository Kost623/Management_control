spring:
  datasource:
    url: jdbc:h2:mem:mc_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

management:
  control:
    jwt:
      secret: test-secret-test-secret-test-secret-test-secret
    admin:
      username: admin
      password: admin123
    storage:
      screenshots-path: ./target/test-screenshots

logging:
  level:
    org.hibernate.SQL: WARN
