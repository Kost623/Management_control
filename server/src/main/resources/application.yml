spring:
  application:
    name: management-control-server
  datasource:
    url: ${MC_DB_URL:jdbc:mariadb://localhost:3307/management_control?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${MC_DB_USER:mc_user}
    password: ${MC_DB_PASSWORD:mc_secret_pass}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${MC_PORT:8080}
  error:
    include-message: always
  tomcat:
    max-swallow-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

management.control:
  # Термін дії device-токена (агент не зберігає дані локально, але токен треба періодично оновлювати)
  device-token-ttl: ${MC_DEVICE_TOKEN_TTL:P30D}
  # Скільки часу агент чекає на команди (long-poll)
  command-poll-timeout: ${MC_COMMAND_POLL_TIMEOUT:30s}
  # Інтервал heartbeat від агента
  heartbeat-interval: ${MC_HEARTBEAT_INTERVAL:60s}
  jwt:
    secret: ${MC_JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    access-token-ttl: ${MC_JWT_TTL:8h}
    issuer: management-control
  admin:
    username: ${MC_ADMIN_USERNAME:admin}
    password: ${MC_ADMIN_PASSWORD:admin123}
  storage:
    screenshots-path: ${MC_SCREENSHOTS_PATH:./data/screenshots}
    max-screenshots-per-day: 35
    min-screenshots-per-day: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.managementcontrol: INFO
